name: Branch Build CE

on:
  workflow_dispatch:
  push:
    branches:
      - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build-Push ${{ matrix.image }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: plane-frontend
            build-context: .
            dockerfile-path: ./apps/web/Dockerfile.web
          - image: plane-space
            build-context: .
            dockerfile-path: ./apps/space/Dockerfile.space
          - image: plane-admin
            build-context: .
            dockerfile-path: ./apps/admin/Dockerfile.admin
          - image: plane-live
            build-context: .
            dockerfile-path: ./apps/live/Dockerfile.live
          - image: plane-backend
            build-context: ./apps/api
            dockerfile-path: ./apps/api/Dockerfile.api
          - image: plane-proxy
            build-context: ./apps/proxy
            dockerfile-path: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lowercases the owner automatically (GHCR requires lowercase image names)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.build-context }}
          file: ${{ matrix.dockerfile-path }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
